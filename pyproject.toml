[project]
name = "comfyui-workflow-model-downloader-mirror"
description = "Scan workflows for required models and download them automatically from HuggingFace (with configurable mirror), CivitAI, and other sources. Features include filter dropdowns, Tavily AI-powered advanced search, metadata caching, and automatic URL restoration."
version = "1.11.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "huggingface_hub",
    "tavily-python",
    "aiohttp",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/promoteAI/comfyui-workflow-model-downloader"
Documentation = "https://github.com/promoteAI/comfyui-workflow-model-downloader#readme"
"Bug Tracker" = "https://github.com/promoteAI/comfyui-workflow-model-downloader/issues"

[tool.comfy]
PublisherId = "promote-ai"
DisplayName = "Workflow Model Downloader (Mirror)"
Icon = "https://raw.githubusercontent.com/promoteAI/comfyui-workflow-model-downloader/main/images/workflow-models-tab.png"

